<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Autorização do TikTok</title>
<style>
  :root { --fundo:#0b0f14; --texto:#e8ecf1; --suave:#9aa4b2; --verde:#00c86e; }
  body { margin:0; background:var(--fundo); color:var(--texto); font:16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:680px; margin:0 auto; padding:56px 16px; }
  code { display:block; background:#151b23; padding:12px; border-radius:8px; word-break:break-all; color:var(--verde); }
  p { color:var(--suave); }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Autorização do TikTok</h1>
  <p id="msg">Aguardando…</p>
  <code id="codigo" hidden></code>
</main>
<script>
  // Página de retorno do login do TikTok. Não envia nada a lugar nenhum:
  // só mostra o código para ser copiado de volta na ferramenta local.
  var q = new URLSearchParams(location.search);
  var msg = document.getElementById("msg");
  if (q.get("code")) {
    document.getElementById("titulo").textContent = "Pronto!";
    msg.textContent = "Copie o endereço desta página inteiro (barra de endereços) e cole no terminal onde a ferramenta pediu.";
  } else if (q.get("error")) {
    msg.textContent = "A autorização não foi concluída: " + (q.get("error_description") || q.get("error"));
  } else {
    msg.textContent = "Esta página só é usada no retorno do login do TikTok.";
  }
</script>
</main>
</body>
</html>
